<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Accommodation</title>
  <style>
:root {
  --sea: #0e4f56;
  --sea-dark: #093a40;
  --mist: #eef3f2;
  --paper: #ffffff;
  --ink: #1b2b2e;
  --muted: #5f7276;
  --line: #d3dedd;
  --sun: #d98b2b;
  --sun-dark: #b87016;
}

* { box-sizing: border-box; margin: 0; }

body {
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: var(--mist);
  color: var(--ink);
  line-height: 1.5;
}

button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* Header */
.site-header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 32px;
  background: var(--sea);
  color: #fff;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  color: #fff; text-decoration: none; font-weight: 700;
}
.logo-mark {
  display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid #fff; font-family: Georgia, serif;
}
.main-nav { display: flex; gap: 28px; margin-left: auto; }
.main-nav a { color: #d9ecec; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.main-nav a:hover { color: #fff; border-color: var(--sun); }
.header-tools { display: flex; gap: 8px; }
.icon-btn {
  position: relative; display: grid; place-items: center;
  width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: transparent; color: #fff;
}
.icon-btn:hover { background: var(--sea-dark); }
.cart-count {
  position: absolute; top: 0; right: 0;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--sun); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
}

/* Page */
.page { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; color: var(--sea-dark); }
.pcs { color: var(--muted); }
.pcs strong { color: var(--ink); }

.layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; align-items: start; }

/* Slider */
.slide-frame {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.slide-art { height: 440px; display: grid; place-items: center; transition: background .4s; }
.slide-art svg { width: 120px; height: 120px; opacity: .85; }
.slide-caption { padding: 18px 22px 22px; }
.slide-caption h2 { font-family: Georgia, serif; font-size: 1.4rem; }
.slide-caption p { color: var(--muted); margin-top: 4px; }
.arrow {
  position: absolute; top: 170px;
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.92); color: var(--sea-dark);
  font-size: 28px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.arrow:hover { background: #fff; }
.prev { left: 14px; }
.next { right: 14px; }

.pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.pagination button {
  width: 12px; height: 12px; padding: 0; border-radius: 50%;
  border: 2px solid var(--sea); background: transparent;
}
.pagination button[aria-selected="true"] { background: var(--sea); transform: scale(1.2); }

/* Offer panel */
.offer {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 22px;
  display: grid;
  gap: 18px;
}
.offer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.offer-head h2 { font-family: Georgia, serif; font-size: 1.3rem; }
.badge { background: var(--sun); color: #fff; font-weight: 700; font-size: .85rem; padding: 4px 12px; border-radius: 999px; }

.bed-options { display: grid; gap: 8px; }
.bed-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.field { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
.field select {
  height: 40px; padding: 0 12px; font: inherit; font-weight: 400; color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; background: var(--mist);
}
.addon { display: grid; gap: 10px; margin-top: 6px; padding-top: 14px; border-top: 1px dashed var(--line); }
.addon-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.select-wrap { display: flex; align-items: center; gap: 8px; }
.select-wrap select { flex: 1; min-width: 0; }
.add-spacer, .add-circle { order: -1; flex: none; width: 36px; }
.add-circle {
  display: grid; place-items: center; height: 36px; padding: 0;
  border: 2px solid var(--ink); border-radius: 50%; background: #fff; color: var(--ink);
  font-size: 1.4rem; font-weight: 700; line-height: 1;
}
.add-circle:hover:not(:disabled) { background: var(--ink); color: #fff; }
.add-circle:disabled { opacity: .35; cursor: not-allowed; }
#addonList { display: grid; gap: 12px; }
.addon-item { display: flex; align-items: flex-end; gap: 10px; }
.addon-item .bed-row { flex: 1; }
.remove-btn {
  flex: none; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--mist); font-size: 1.3rem; color: #a3341f;
}
.remove-btn:hover { background: #f3d9d4; }
.addon h3 { font-size: 1.05rem; }
.addon h3 small { font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 6px; }
.bed-note { font-size: .85rem; color: var(--muted); }

.bed-picture {
  display: grid; place-items: center; height: 170px;
  background: var(--mist); border: 1px dashed var(--line); border-radius: 6px;
}
.bed-picture svg { max-width: 90%; height: 135px; }
.bed-picture figcaption { font-size: .8rem; color: var(--muted); }

.price-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.price { font-family: Georgia, serif; font-size: 1.9rem; color: var(--sea-dark); line-height: 1.1; }
.per { color: var(--muted); font-size: .85rem; }
.spa { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .95rem; }
.spa em { font-style: normal; color: var(--sun-dark); font-weight: 600; }

.qty-row { display: flex; align-items: center; justify-content: space-between; }
.qty-row small { color: var(--muted); }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; }
.stepper button { width: 38px; height: 38px; border: 0; background: var(--mist); font-size: 20px; }
.stepper button:hover:not(:disabled) { background: var(--line); }
.stepper button:disabled { opacity: .4; cursor: not-allowed; }
.stepper output { min-width: 46px; text-align: center; font-weight: 700; }
.qty-msg { min-height: 1.2em; margin: -4px 0 0; font-size: .85rem; color: #a3341f; }

.total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.total-row strong { font-size: 1.4rem; }
.book-btn {
  padding: 13px; border: 0; border-radius: 6px;
  background: var(--sea); color: #fff; font-weight: 700; font-size: 1rem;
}
.book-btn:hover { background: var(--sea-dark); }

/* Responsive */
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .site-header { flex-wrap: wrap; padding: 12px 16px; }
  .main-nav { order: 3; width: 100%; margin-left: 0; gap: 18px; overflow-x: auto; }
  .header-tools { margin-left: auto; }
  .slide-art { height: 260px; }
  .arrow { top: 108px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>

  <!-- HEADER: logo, nav, search, cart -->
  <header class="site-header">
    <a href="#" class="logo" aria-label="Company logo"><span class="logo-mark">H</span> Logo</a>
    <nav class="main-nav" aria-label="Main">
      <a href="#">Home</a>
      <a href="#">Trip Planner</a>
      <a href="#">Book Destination</a>
    </nav>
    <div class="header-tools">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <button class="icon-btn" aria-label="Booking cart">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="title-row">
      <h1>Hotel Company Name</h1>
      <p class="pcs"><strong id="roomTotal">11</strong> pcs</p>
    </div>

    <div class="layout">
      <!-- LEFT: room slider + pagination -->
      <section class="slider" aria-label="Rooms">
        <div class="slide-frame">
          <button class="arrow prev" id="prevBtn" aria-label="Previous room">&#8249;</button>
          <div class="slide" id="slide">
            <div class="slide-art" id="slideArt"></div>
          </div>
          <button class="arrow next" id="nextBtn" aria-label="Next room">&#8250;</button>
        </div>
        <div class="pagination" id="pagination" role="tablist" aria-label="Room pages"></div>
      </section>

      <!-- RIGHT: special offer -->
      <aside class="offer" aria-label="Hotel special offer">
        <div class="offer-head">
          <h2>Hotel Special Offer</h2>
          <span class="badge">Save 15%</span>
        </div>

        <div class="bed-options">
          <div class="bed-row">
            <label class="field" for="bedSelect">
              <span>Bed size</span>
              <select id="bedSelect"></select>
            </label>
            <div class="field">
              <span id="bedCountLabel">No. of beds</span>
              <div class="stepper" role="group" aria-labelledby="bedCountLabel">
                <button id="qtyMinus" aria-label="Fewer beds">−</button>
                <output id="qty">1</output>
                <button id="qtyPlus" aria-label="More beds">+</button>
              </div>
            </div>
          </div>
          <p class="qty-msg" id="qtyMsg" role="status">&nbsp;</p>
          <div class="addon">
            <div class="addon-head">
              <h3>Adds on <small>Add another bed</small></h3>
            </div>
            <div id="addonList"></div>
            <p class="bed-note" id="bedNote"></p>
          </div>
        </div>

        <div class="bed-picture" id="bedPicture" aria-hidden="true"></div>

        <div class="price-row">
          <div>
            <p class="price" id="price">₱0</p>
            <p class="per">per room, per night</p>
          </div>
        </div>
        <p class="qty-msg" id="roomsMsg" role="status">&nbsp;</p>

        <div class="total-row">
          <span>Total</span>
          <strong id="total">₱0</strong>
        </div>
        <button class="book-btn" id="bookBtn">Proceed to booking information</button>
      </aside>
    </div>
  </main>

  <script>
// ----- Data -----
const rooms = [
  { name: "Standard Room",        desc: "Quiet room with garden view.",          price: 1800, color: "#cfe3df" },
  { name: "Deluxe Room",          desc: "Bigger space with a work desk.",        price: 2400, color: "#d9e6d0" },
  { name: "Superior Room",        desc: "High floor with city view.",            price: 2700, color: "#e6e2cc" },
  { name: "Family Room",          desc: "Fits the whole family comfortably.",    price: 3600, color: "#e9d9c4" },
  { name: "Junior Suite",         desc: "Separate sitting area.",                price: 4200, color: "#e5cfc9" },
  { name: "Executive Suite",      desc: "Lounge access and breakfast.",          price: 5200, color: "#d6d3e6" },
  { name: "Ocean View Room",      desc: "Balcony facing the sea.",               price: 4800, color: "#c6dfe8" },
  { name: "Garden Villa",         desc: "Private garden and plunge pool.",       price: 6500, color: "#cde4cf" },
  { name: "Honeymoon Suite",      desc: "Bathtub, candles, late checkout.",      price: 7200, color: "#ecd2d9" },
  { name: "Presidential Suite",   desc: "Two bedrooms, dining area, butler.",    price: 9800, color: "#ddd3b8" },
  { name: "Penthouse",            desc: "Top floor with a rooftop terrace.",     price: 12000, color: "#c9d3dc" }
];

const beds = [
  { id: "single", label: "Single bed",      add: 500,    width: 70 },
  { id: "double", label: "Double size bed", add: 700,  width: 100 },
  { id: "full",   label: "Full size",       add: 800,  width: 110 },
  { id: "queen",  label: "Queen size",      add: 1000,  width: 130 },
  { id: "king",   label: "King size",       add: 1300,  width: 150 },
  { id: "family", label: "Family size",     add: 1600, width: 190 }
];

const MAX_ROOMS = 20;
const DISCOUNT = 0.15;
const MAX_ADDONS = 5;

// ----- State -----
const state = { slide: 0, bed: "single", qty: 1, addons: [{ bed: "single", qty: 1 }], rooms: 1, cart: 0 };

// ----- Elements -----
const $ = (id) => document.getElementById(id);
const el = {
  bedNote: $("bedNote"),
  art: $("slideArt"),
  pag: $("pagination"), bedSelect: $("bedSelect"), bedPicture: $("bedPicture"),
  price: $("price"), total: $("total"), qty: $("qty"), qtyMsg: $("qtyMsg"),
  minus: $("qtyMinus"), plus: $("qtyPlus"),
  cart: $("cartCount"), roomTotal: $("roomTotal")
};

const peso = (n) => "₱" + Math.round(n).toLocaleString("en-PH");

// ----- Slider -----
function renderSlide() {
  const r = rooms[state.slide];
  el.art.style.background = r.color;
  el.art.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#0e4f56" stroke-width="1.2"><path d="M3 18V8M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="1.6"/></svg>';
  el.art.setAttribute("aria-label", r.name);
  [...el.pag.children].forEach((b, i) => b.setAttribute("aria-selected", i === state.slide));
  renderPrice();
}

function goTo(i) {
  state.slide = (i + rooms.length) % rooms.length;
  renderSlide();
}

function buildPagination() {
  rooms.forEach((r, i) => {
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", `Room ${i + 1}: ${r.name}`);
    b.addEventListener("click", () => goTo(i));
    el.pag.appendChild(b);
  });
}

// ----- Bed options -----
function buildBeds() {
  beds.forEach((b) => el.bedSelect.add(new Option(b.label, b.id)));
  el.bedSelect.addEventListener("change", () => {
    state.bed = el.bedSelect.value;
    renderBed();
    renderPrice();
  });
}

function renderBed() {
  const b = beds.find((x) => x.id === state.bed);
  const w = b.width;
  const x = (200 - w) / 2;
  const lines = state.addons.filter((a) => a.qty > 0)
    .map((a) => `+ ${a.qty} ${beds.find((s) => s.id === a.bed).label}`);
  const shown = lines.slice(0, 3);
  if (lines.length > 3) shown.push(`+ ${lines.length - 3} more`);
  const text = shown.map((t, i) =>
    `<text x="100" y="${98 + i * 12}" text-anchor="middle" font-size="10" fill="#b87016" font-weight="700">${t}</text>`).join("");
  el.bedPicture.innerHTML =
    `<svg viewBox="0 0 200 135" role="img" aria-label="${b.label}">` +
    `<rect x="${x}" y="30" width="${w}" height="12" rx="3" fill="#0e4f56"/>` +
    `<rect x="${x + 4}" y="42" width="${w - 8}" height="30" rx="4" fill="#fff" stroke="#0e4f56" stroke-width="2"/>` +
    `<rect x="${x + 10}" y="46" width="${Math.min(30, w / 3)}" height="12" rx="4" fill="#d98b2b"/>` +
    `<text x="192" y="18" text-anchor="end" font-size="16" font-weight="700" fill="#0e4f56">× ${state.qty}</text>` +
    `<rect x="${x}" y="72" width="6" height="16" fill="#0e4f56"/>` +
    `<rect x="${x + w - 6}" y="72" width="6" height="16" fill="#0e4f56"/>` +
    text + `</svg>`;
}

// ----- Price + quantity -----
function extrasPerRoom() {
  return state.addons.reduce((sum, a) => sum + beds.find((s) => s.id === a.bed).add * a.qty, 0);
}

function unitPrice() {
  return (rooms[state.slide].price + extrasPerRoom()) * (1 - DISCOUNT);
}

function renderPrice() {
  const unit = unitPrice();
  el.price.textContent = peso(unit);
  el.total.textContent = peso(unit * state.rooms);
  const n = state.addons.reduce((s, a) => s + a.qty, 0);
  $("bedNote").textContent = n
    ? `${n} extra bed${n > 1 ? "s" : ""}: +${peso(extrasPerRoom() * (1 - DISCOUNT))} per room.`
    : "Tap + to add another bed.";
}

function setQty(n) {
  if (n > MAX_ROOMS) {
    el.qtyMsg.textContent = `Up to ${MAX_ROOMS} beds only.`;
    n = MAX_ROOMS;
  } else {
    el.qtyMsg.innerHTML = "&nbsp;";
  }
  state.qty = Math.max(1, n);
  el.qty.textContent = state.qty;
  el.minus.disabled = state.qty <= 1;
  el.plus.disabled = state.qty >= MAX_ROOMS;
  renderBed();
  renderPrice();
}

function renderAddons() {
  const list = $("addonList");
  list.innerHTML = "";
  state.addons.forEach((a, i) => {
    const row = document.createElement("div");
    row.className = "addon-item";
    row.innerHTML =
      `<div class="bed-row"><div class="field"><label for="addon-sel-${i}">Bed size</label><div class="select-wrap"><select class="addon-select" id="addon-sel-${i}">` +
      beds.map((b) => `<option value="${b.id}" ${b.id === a.bed ? "selected" : ""}>${b.label}</option>`).join("") +
      `</select>` +
      (i === state.addons.length - 1
        ? `<button type="button" class="add-circle" aria-label="Add another bed" ${state.addons.length >= MAX_ADDONS ? "disabled" : ""}>+</button>`
        : `<span class="add-spacer"></span>`) +
      `</div></div><div class="field"><span>No. of beds</span><div class="stepper">` +
      `<button type="button" class="a-minus" aria-label="Fewer extra beds">−</button><output>${a.qty}</output>` +
      `<button type="button" class="a-plus" aria-label="More extra beds">+</button></div></div></div>` +
      (state.addons.length > 1 ? `<button type="button" class="remove-btn" aria-label="Remove this bed">×</button>` : "");
    const out = row.querySelector("output");
    const minus = row.querySelector(".a-minus");
    const plus = row.querySelector(".a-plus");
    const sync = () => {
      out.textContent = a.qty;
      minus.disabled = a.qty <= 0;
      plus.disabled = a.qty >= MAX_ROOMS;
      renderBed();
      renderPrice();
    };
    row.querySelector(".addon-select").addEventListener("change", (e) => { a.bed = e.target.value; sync(); });
    minus.addEventListener("click", () => { a.qty = Math.max(0, a.qty - 1); sync(); });
    plus.addEventListener("click", () => { a.qty = Math.min(MAX_ROOMS, a.qty + 1); sync(); });
    const addBtn = row.querySelector(".add-circle");
    if (addBtn) addBtn.addEventListener("click", () => {
      if (state.addons.length < MAX_ADDONS) { state.addons.push({ bed: "single", qty: 1 }); renderAddons(); }
    });
    const rm = row.querySelector(".remove-btn");
    if (rm) rm.addEventListener("click", () => { state.addons.splice(i, 1); renderAddons(); });
    minus.disabled = a.qty <= 0;
    plus.disabled = a.qty >= MAX_ROOMS;
    list.appendChild(row);
  });
  renderBed();
  renderPrice();
}

// ----- Events -----
$("prevBtn").addEventListener("click", () => goTo(state.slide - 1));
$("nextBtn").addEventListener("click", () => goTo(state.slide + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, button")) return;
  if (e.key === "ArrowLeft") goTo(state.slide - 1);
  if (e.key === "ArrowRight") goTo(state.slide + 1);
});
el.minus.addEventListener("click", () => setQty(state.qty - 1));
el.plus.addEventListener("click", () => setQty(state.qty + 1));

$("bookBtn").addEventListener("click", () => {
  state.cart += state.rooms;
  el.cart.textContent = state.cart;
  const r = rooms[state.slide];
  const msg = $("roomsMsg");
  msg.style.color = "#0e4f56";
  msg.textContent = `${r.name} selected. Proceeding to booking information…`;
  setTimeout(() => { msg.innerHTML = "&nbsp;"; msg.style.color = ""; }, 2500);
});

$("searchBtn").addEventListener("click", () => {
  const q = prompt("Search rooms by name:");
  if (!q) return;
  const i = rooms.findIndex((r) => r.name.toLowerCase().includes(q.toLowerCase()));
  i >= 0 ? goTo(i) : alert("No room found.");
});

// ----- Init -----
el.roomTotal.textContent = rooms.length;
buildPagination();
buildBeds();
renderBed();
renderSlide();
setQty(1);
renderAddons();

</script>
</body>
</html>
